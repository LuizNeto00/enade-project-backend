services:
  api:
    build:
      context: .
      target: development
    container_name: nest-api
    command: npm run start:dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: '3306'
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-24}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      MOCK_EXAM_MAX_PDF_SIZE_BYTES: ${MOCK_EXAM_MAX_PDF_SIZE_BYTES:-52428800}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./uploads:/usr/src/app/uploads
      - mock_exam_pdfs:/usr/src/app/storage/mock-exams
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: nest-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  mock_exam_pdfs:
